  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: #0a0a0a;
      border-bottom: 1px solid #222;
    }
    header a {
      color: #FFD700;
      text-decoration: none;
      font-weight: 600;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      max-width: 70%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-wrap {
      max-width: 1100px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }
    video {
      width: 100%;
      max-height: 80vh;
      min-height: 240px;
      background: #111;
      border-radius: 12px;
    }
    .no-video {
      aspect-ratio: 16/9;
      background: #111;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
      gap: 0.5rem;
    }
    @media (max-width: 700px) {
      header { padding: 0.7rem 1rem; }
      h1 { font-size: 0.95rem; max-width: 60%; }
      .player-wrap { margin: 0.5rem auto; padding: 0 0.5rem; }
      video { max-height: 60vh; border-radius: 8px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Voltar</a>
    <h1 id="title">Carregando...</h1>
    <div></div>
  </header>

  <div class="player-wrap">
    <video id="player" controls autoplay>
      Seu navegador não suporta vídeo.
    </video>
    <div class="no-video" id="noVideo" style="display:none;">
      <span>▶</span>
      <span>Vídeo não disponível</span>
    </div>
    <div style="text-align:center; margin-top:1.5rem;">
      <a href="index.html" style="color:#FFD700; text-decoration:none; font-weight:600; font-size:0.95rem;">← Voltar ao catálogo</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get('title') || 'Dorama';
    const video = params.get('video');

    document.getElementById('title').textContent = title;
    document.title = title + ' - TopDoramas';

    const player = document.getElementById('player');
    const noVideo = document.getElementById('noVideo');

    function showBlocked(msg) {
      player.style.display = 'none';
      noVideo.style.display = 'flex';
      noVideo.querySelector('span:last-child').textContent = msg;
    }

    function startVideo() {
      if (!video) { showBlocked('Vídeo não disponível'); return; }
      player.src = video;
      player.style.display = 'block';
      noVideo.style.display = 'none';
      player.onerror = () => showBlocked('Este link de vídeo expirou. Envie um link novo.');
    }

    async function gate() {
      const isVod = video && video.includes('nixplay.lat');
      if (!isVod) { startVideo(); return; }
      const supabaseClient = supabase.createClient('https://qeporypjsrtoihdxtjoq.supabase.co', 'sb_publishable_pGZjcRFm8AAlcbiab-8jXA_BB-hvILi');
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { showBlocked('Assine o VIP para assistir.'); return; }
      const isAdmin = session.user.email === 'admin@topdoramas.com' || session.user.user_metadata?.role === 'admin';
      const isVipUser = isAdmin || session.user.user_metadata?.vip === true || session.user.email === 'gabrieltanajura@gmail.com';
      if (isVipUser) { startVideo(); return; }
      const { data } = await supabaseClient.from('purchases').select('id').eq('email', session.user.email).eq('dorama_title', 'Assinatura VIP').eq('status', 'paid').limit(1);
      if (data && data.length) startVideo();
      else showBlocked('Assine o VIP para assistir.');
    }
    gate();
  </script>
</body>
</html>
